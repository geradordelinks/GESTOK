<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gestok | Movimentações</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
    <link
        rel="stylesheet"
        href="../componentes/sidebar.css"
    >
</head>

<body>
    <div id="gestok-sidebar-container"></div>
    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <div class="header-left">

            <button
                class="menu-button"
                id="menuButton"
                type="button"
                aria-label="Abrir menu"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>

            <span class="page-name">
                Movimentações
            </span>

        </div>

    </header>


    <!-- =========================================
         CONTEÚDO PRINCIPAL
    ========================================== -->

    <main class="main-content">


        <!-- Voltar -->

        <a
            href="../sistema/index.html"
            class="back-dashboard"
        >
            ← Voltar ao Dashboard
        </a>


        <!-- =========================================
             CABEÇALHO
        ========================================== -->

        <section class="hero">

            <div>

                <span class="eyebrow">
                    ESTOQUE
                </span>

                <h1>
                    Movimentações
                </h1>

                <p>
                    Histórico de entradas e saídas do estoque.
                </p>

            </div>

        </section>


        <!-- =========================================
             PAINEL
        ========================================== -->

        <section class="panel">


            <!-- =========================================
                 FILTROS
            ========================================== -->

            <div class="filters">

                <input
                    id="busca"
                    type="search"
                    placeholder="Buscar produto, código ou motivo..."
                >


                <select id="filtroTipo">

                    <option value="">
                        Todos os tipos
                    </option>

                    <option value="Entrada">
                        Entradas
                    </option>

                    <option value="Saída">
                        Saídas
                    </option>

                </select>


                <select id="filtroPeriodo">

                    <option value="">
                        Todos os períodos
                    </option>

                    <option value="hoje">
                        Hoje
                    </option>

                    <option value="7">
                        Últimos 7 dias
                    </option>

                    <option value="30">
                        Últimos 30 dias
                    </option>

                </select>


                <button
                    id="limparHistorico"
                    type="button"
                >
                    Limpar histórico
                </button>

            </div>


            <!-- =========================================
                 TABELA
            ========================================== -->

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Tipo
                            </th>

                            <th>
                                Produto
                            </th>

                            <th>
                                Quantidade
                            </th>

                            <th>
                                Estoque
                            </th>

                            <th>
                                Motivo
                            </th>

                            <th>
                                Data
                            </th>

                        </tr>

                    </thead>


                    <tbody id="listaMovimentacoes">
                    </tbody>

                </table>

            </div>


            <!-- =========================================
                 ESTADO VAZIO
            ========================================== -->

            <div
                class="empty-state"
                id="emptyState"
                style="display: none;"
            >

                <div>
                    ↔
                </div>

                <strong>
                    Nenhuma movimentação encontrada
                </strong>

                <span>
                    As entradas e saídas aparecerão aqui.
                </span>

            </div>

        </section>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->
    <script src="../componentes/sidebar.js"></script>
    <script src="../auth.js"></script>
    <script src="script.js"></script>

</body>

</html>
