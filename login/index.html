<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gestok | Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main>

        <!-- CARD DE LOGIN -->

        <section class="card">


            <!-- LOGO -->

            <div class="logo">
                G
            </div>


            <!-- TÍTULO -->

            <span class="eyebrow">
                ACESSAR O SISTEMA
            </span>


            <h1>
                Bem-vindo ao Gestok
            </h1>


            <p>
                Entre com o Código da Loja,
                usuário e senha.
            </p>


            <!-- FORMULÁRIO -->

            <form>


                <!-- CÓDIGO DA LOJA -->

                <label>

                    Código da Loja

                    <input
                        id="codigoLoja"
                        type="text"
                        inputmode="numeric"
                        maxlength="4"
                        placeholder="Ex.: 0001"
                        autocomplete="off"
                        required
                    >

                    <small class="field-help">
                        Código de 4 dígitos da sua empresa.
                    </small>

                </label>


                <!-- USUÁRIO -->

                <label>

                    Usuário

                    <input
                        id="usuario"
                        type="text"
                        placeholder="Seu usuário"
                        autocomplete="username"
                        required
                    >

                </label>


                <!-- SENHA -->

                <label>

                    Senha

                    <input
                        id="senha"
                        type="password"
                        placeholder="Sua senha"
                        autocomplete="current-password"
                        required
                    >

                </label>


                <!-- MENSAGEM -->

                <div
                    id="mensagemLogin"
                    class="form-message"
                    hidden
                ></div>


                <!-- BOTÃO -->

                <button type="submit">

                    Entrar no Gestok →

                </button>


            </form>


            <!-- LINKS -->

            <div class="links">

                <a href="../cadastro/index.html">
                    Criar uma conta
                </a>

                <a href="../apresentacao.html">
                    Voltar à apresentação
                </a>

            </div>


        </section>

    </main>


    <!-- AUTENTICAÇÃO -->

    <script src="../auth.js"></script>


    <!-- SCRIPT -->

    <script src="script.js"></script>

</body>

</html>
