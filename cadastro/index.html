<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gestok | Criar conta</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main>

        <!-- Voltar para os planos -->
        <a
            href="../planos/index.html"
            class="back"
        >
            ← Voltar aos planos
        </a>


        <!-- Card de cadastro -->
        <section class="card">

            <!-- Logo -->
            <div class="logo">
                G
            </div>


            <!-- Título -->
            <span class="eyebrow">
                CRIAR CONTA
            </span>

            <h1>
                Comece seu Gestok
            </h1>

            <p>
                Crie sua conta e comece a usar o Gestok
                por 30 dias.
            </p>


            <!-- Formulário -->
            <form>

                <!-- Nome -->
                <label>
                    Nome

                    <input
                        id="nome"
                        type="text"
                        placeholder="Seu nome"
                        autocomplete="name"
                        required
                    >
                </label>


                <!-- E-mail -->
                <label>
                    E-mail

                    <input
                        id="email"
                        type="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >
                </label>


                <!-- Senha -->
                <label>
                    Senha

                    <input
                        id="senha"
                        type="password"
                        placeholder="Mínimo de 6 caracteres"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </label>


                <!-- Confirmação da senha -->
                <label>
                    Confirmar senha

                    <input
                        id="confirmarSenha"
                        type="password"
                        placeholder="Repita sua senha"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </label>


                <!-- Mensagem do formulário -->
                <div
                    id="mensagemCadastro"
                    class="form-message"
                    hidden
                ></div>


                <!-- Botão -->
                <button type="submit">
                    Criar minha conta →
                </button>

            </form>


            <!-- Login -->
            <div class="login">

                Já possui uma conta?

                <a href="../login/index.html">
                    Entrar
                </a>

            </div>

        </section>

    </main>


    <!-- Autenticação -->
    <script src="../auth.js"></script>

    <!-- Script do cadastro -->
    <script src="script.js"></script>

</body>

</html>
